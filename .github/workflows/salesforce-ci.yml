name: Salesforce CI/CD

on:
  push:
    branches:
      - main
      - feature/*

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Code load
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Salesforce CLI
      - name: Install SF CLI
        run: npm install @salesforce/cli -g

      # 3. Authenticate org
      - name: Auth Salesforce
        run: |
          echo "${{ secrets.SF_AUTH_URL }}" > auth.txt
          sf org login sfdx-url -f auth.txt -a myOrg

      # 4. Validate (CI)
      - name: Validate
        run: |
          sf project deploy start --check-only --target-org myOrg

      # 5. Run Tests
      - name: Run Tests
        run: |
          sf apex run test --target-org myOrg --result-format human

      # 6. Deploy (CD)
      - name: Deploy
        run: |
          sf project deploy start --target-org myOrg